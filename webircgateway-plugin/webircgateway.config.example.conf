# Example webircgateway config for hiding server IP and passing user IPs
#
# Copy to your webircgateway install and rename to config.conf
# See: https://github.com/kiwiirc/webircgateway

[server]
# Bind to localhost only -- nginx handles public-facing connections,
# so the real server IP is never exposed to users.
listen = 127.0.0.1:7778

[reverse_proxies]
# Trust these IPs to provide real client IPs via X-Forwarded-For.
# Without this, all users appear to connect from the nginx IP.
127.0.0.1 = true
::1 = true

[upstream]
# Your IRC server
hostname = 127.0.0.1
port = 6667
tls = false

# WEBIRC: tells the IRCd the real user IP so users don't all appear
# to connect from the gateway's IP. This password must match your
# IRCd's webirc block.
webirc = CHANGE_ME_to_match_ircd

[client]
# Allowed client origins (glob patterns)
# In production, restrict this to your actual domain
allowed_origins = https://irc.example.com
